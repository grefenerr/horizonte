<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORIZONTE - OctaVision</title>

  <!-- Fontes -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">

  <style>
  :root {
    --bg-primary: #000000;
    --bg-secondary: #0a0a0a;
    --text-primary: #ffffff;
    --text-secondary: #b3b3b3;
    --text-muted: #666666;
    --accent-1: #00c2ff;
    --accent-2: #33ff8c;
    --accent-3: #ffc640;
    --accent-4: #e54cff;
    --accent-5: #ff6b6b;
    --accent-6: #4ecdc4;
    --accent-7: #45b7d1;
    --accent-8: #96ceb4;
    --border: rgba(255,255,255,0.1);
    --shadow: rgba(0,0,0,0.3);
    --gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-4));
    --rainbow: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff);
  }

  [data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f9fa;
    --text-primary: #2c3e50;
    --text-secondary: #34495e;
    --text-muted: #7f8c8d;
    --border: rgba(0,0,0,0.1);
    --shadow: rgba(0,0,0,0.1);
    --header-bg: #ffffff;
    --header-text: #2c3e50;
    --card-bg: #ffffff;
    --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 16px;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: all 0.3s ease;
      min-height: 100vh;
      overflow-x: hidden;
    }

  /* Header */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: var(--header-bg, rgba(0,0,0,0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 3px solid transparent;
    background-image: var(--rainbow);
    background-size: 300% 300%;
    background-clip: border-box;
    animation: rainbowShift 3s ease infinite;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--header-bg, rgba(0,0,0,0.9));
    z-index: -1;
  }

    .logo {
      height: 50px;
      transition: transform 0.2s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

  .nav-link {
    color: var(--header-text, var(--text-secondary));
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    position: relative;
    padding: 8px 16px;
    border-radius: 25px;
    background: transparent;
    overflow: hidden;
  }

  .nav-link::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: var(--rainbow);
    background-size: 300% 300%;
    animation: rainbowShift 3s ease infinite;
    transition: left 0.3s ease;
    z-index: -1;
  }

  .nav-link:hover {
    color: white;
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }

  .nav-link:hover::before {
    left: 0;
  }

  .nav-link:active {
    transform: translateY(0) scale(0.95);
  }

    .theme-toggle {
      background: var(--rainbow);
      background-size: 300% 300%;
      animation: rainbowShift 3s ease infinite;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .theme-toggle:hover {
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .theme-toggle:active {
      transform: translateY(-1px) scale(1.05);
    }


    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 2rem;
      position: relative;
    }

    .hero-title {
      font-family: 'Space Age', sans-serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 2rem;
      background: var(--rainbow);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbowShift 3s ease infinite, fadeInUp 1.5s ease forwards;
      position: relative;
      display: inline-block;
    }


    .hero-subtitle {
      font-size: 1.5rem;
      color: var(--text-secondary);
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      animation: fadeInUp 1.5s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
    }

    .ecologia {
      color: var(--accent-2);
      font-weight: 600;
      position: relative;
      display: inline-block;
    }


    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      z-index: 100;
    }

    /* Animations */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.05) rotate(5deg);
      }
      70% {
        transform: scale(0.95) rotate(-2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes sparkle {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(180deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
        height: auto;
        flex-direction: column;
        gap: 1rem;
      }

      .nav {
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-link {
        font-size: 11px;
        padding: 6px 12px;
      }

      .theme-toggle {
        font-size: 10px;
        padding: 8px 16px;
      }

      .hero {
        padding: 140px 1rem 2rem;
        min-height: calc(100vh - 140px);
      }

      .hero-title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        margin-bottom: 1.5rem;
      }

      .hero-subtitle {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      footer {
        position: relative;
        margin-top: 2rem;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 0.8rem;
      }

      .nav {
        gap: 0.3rem;
      }

      .nav-link {
        font-size: 10px;
        padding: 5px 10px;
      }

      .theme-toggle {
        font-size: 9px;
        padding: 6px 12px;
      }

      .hero {
        padding: 120px 0.8rem 1.5rem;
      }

      .hero-title {
        font-size: clamp(2rem, 7vw, 3.5rem);
      }

      .hero-subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
      <img src="logohorizontepngblack.png" alt="HORIZONTE Logo" class="logo">
    </a>
    <nav class="nav">
      <a class="nav-link" href="funcionamento.html">Como funciona</a>
      <a class="nav-link" href="sobre.html">Sobre nós</a>
      <a class="nav-link" href="quemsomos.html">StartUp</a>
      <a class="nav-link" href="co2.html">CO₂</a>
      <button class="theme-toggle" onclick="toggleDarkMode()">MODE</button>
    </nav>
  </header>

  <main class="hero">
    <h1 class="hero-title">HORIZONTE</h1>
    <p class="hero-subtitle">Visão Computacional, <span class="ecologia">ecologia</span> e futuro.</p>
  </main>
  
  <footer>
    <p>Todos os direitos reservados • HORIZONTE Ltda © 2024</p>
  </footer>

  <script>
    function toggleDarkMode() {
      const html = document.documentElement;
      const logo = document.querySelector('.logo');
      const current = html.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      
      // Trocar logo baseado no tema
      if (newTheme === 'dark') {
        logo.src = 'logohorizontepng.png';
      } else {
        logo.src = 'logohorizontepngblack.png';
      }
      
      // Salvar preferência no localStorage
      localStorage.setItem('theme', newTheme);
    }

    // Aplicar tema salvo ao carregar a página
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      const logo = document.querySelector('.logo');
      
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Aplicar logo correto
      if (savedTheme === 'dark') {
        logo.src = 'logohorizontepng.png';
      } else {
        logo.src = 'logohorizontepngblack.png';
      }
    });
  </script>
</body>
</html>
