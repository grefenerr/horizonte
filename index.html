<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORIZONTE</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #ffffff;
      --text-color: #000000;
      --clr-1: #00c2ff;
      --clr-2: #33ff8c;
      --clr-3: #ffc640;
      --clr-4: #e54cff;
      --blur: 1rem;
      --fs: clamp(3rem, 8vw, 7rem);
      --ls: clamp(-1.75px, -0.25vw, -3.5px);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --text-color: #ffffff;
    }

    @import url("https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap");

    @font-face {
      font-family: 'space_age';
      src: url('space age.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    .title {
      font-family: 'space_age', sans-serif; /* somente aqui */
      font-size: var(--fs);
      font-weight: 800;
      letter-spacing: var(--ls);
      position: relative;
      overflow: hidden;
      margin: 0;
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
      pointer-events: none;
      user-select: none;
      caret-color: transparent;
      background: var(--bg);
      color: var(--text-color);
    }

    * {
      box-sizing: border-box;
      font-family: 'Raleway', sans-serif; /* resto do site */
      margin: 0;
      padding: 0;
      color: var(--text-color);
    }

    html, body {
      overflow-x: hidden;
    }
    
    body {
      min-height: 100vh;
      background-color: var(--bg);
      position: relative;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 0.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, 
        rgba(0, 194, 255, 0.6) 0%, 
        rgba(51, 255, 140, 0.6) 25%, 
        rgba(255, 198, 64, 0.6) 50%, 
        rgba(229, 76, 255, 0.6) 75%);
      backdrop-filter: blur(3px);
      z-index: 10;
      height: auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, 
        var(--clr-1) 0%, 
        var(--clr-2) 25%, 
        var(--clr-3) 50%, 
        var(--clr-4) 75%, 
        var(--clr-1) 100%);
      background-size: 400% 100%;
      opacity: 0.1;
      z-index: -1;
      animation: gradientShift 8s ease infinite;
    }

    .footer {
      position: fixed;
      bottom: 0px;
      width: 100%;
      text-align: center;
      color: var(--text-color);
      font-size: 0.8rem;
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
      animation-delay: 1s;
      z-index: 100;
    }

    .logo-link {
      margin-left: 1rem;
      position: relative;
      z-index: 2;
    }

    .logo {
      height: 89px;
      width: auto;
      display: block;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 0s;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    }

    .nav-buttons {
      display: flex;
      gap: 20px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .glow-button {
      position: relative;
      display: inline-block;
      padding: 9px 14px;
      margin: 20px 0;
      font-size: 12px;
      color: var(--text-color);  
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.5s;
      letter-spacing: 1px;
      overflow: hidden;
      margin-right: 10px;
      font-weight: bold;
      background: none;
      border: none;
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
      animation-delay: 0s;
    }

    .glow-button:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .glow-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .glow-button:hover::before {
      left: 100%;
    }

    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 2rem;
      z-index: 2;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-top: 1rem;
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
      animation-delay: 0s;
    }

    .ecologia {
      font-weight: bold;
      color: #00ff6e;
    }

    /* Botão de modo escuro */
    .dark-mode-toggle {
      padding: 5px 10px;
      font-size: 10px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 4px;
      color: var(--text-color);
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (max-width: 768px) {
      header {
        padding: 1.5rem 1rem;
        flex-direction: column;
        height: auto;
      }
      .logo-link { margin: 0.2rem 0; }
      .nav-buttons { margin: 0.5rem 0; flex-wrap: wrap; justify-content: center; }
      .glow-button { margin: 5px; padding: 8px 12px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
      <img src="logohorizontepngblack.png" alt="Logo" class="logo">
    </a>
    <div class="nav-buttons">
      <a href="funcionamento.html" class="glow-button">Como funciona</a>
      <a href="sobre.html" class="glow-button">Sobre nós</a>
      <a href="quemsomos.html" class="glow-button">StartUp</a>
      <a href="co2.html" class="glow-button">CO₂</a>
      <button class="dark-mode-toggle" onclick="toggleDarkMode()">MODE</button>
    </div>
  </header>

  <div class="content">
    <h1 class="title">HORIZONTE</h1>
    <p class="subtitle">Visão Computacional, <span class="ecologia">ecologia</span> e futuro.</p>
  </div>
  
  <footer class="footer">
    Todos os direitos reservados • HORIZONTE Ltda ©
  </footer>

  <script>
function toggleDarkMode() {
  const html = document.documentElement;
  const logo = document.querySelector('.logo');

  if(html.getAttribute('data-theme') === 'dark'){
    html.removeAttribute('data-theme');
    logo.src = 'logohorizontepngblack.png'; // volta para a logo normal
  } else {
    html.setAttribute('data-theme', 'dark');
    logo.src = 'logohorizontepng.png'; // muda para a logo para dark mode
  }
}
</script>
</body>
</html>
